plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Read version from version.json
def versionFile = file("${rootProject.projectDir}/version.json")
def versionJson = new groovy.json.JsonSlurper().parseText(versionFile.text)

android {
    namespace 'com.videocontrol.mediaplayer'
    compileSdk 34

    defaultConfig {
        applicationId "com.videocontrol.mediaplayer"
        minSdk 21
        targetSdk 34
        versionCode versionJson.versionCode
        versionName versionJson.version
    }

    signingConfigs {
        release {
            storeFile file("keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: ""
            keyPassword System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        abortOnError false
        warningsAsErrors false
        disable 'DuplicatePlatformClasses'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Socket.IO клиент для Kotlin
    implementation 'io.socket:socket.io-client:2.1.0'

    // Security fix: Force okhttp to secure version (overrides transitive dependency)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    
    // Security fix: Force okio to secure version (overrides transitive dependency)
    implementation 'com.squareup.okio:okio:3.6.0'

    // Media3 1.4.0 — последняя стабильная версия с minCompileSdk=34.
    // Один APK без нативных библиотек: arm32/arm64/x86/x86_64 и Android 10+.
    def media3Version = '1.4.0'
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-exoplayer-dash:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    // Классы androidx.media3.datasource.cache.* живут в media3-datasource.
    implementation "androidx.media3:media3-datasource:$media3Version"

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    
    // Lifecycle для lifecycleScope (предотвращение утечек памяти)
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'

    // Gson для JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    // Glide для плавной загрузки изображений с кэшем
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // SVG decoding for server-hosted logos
    implementation 'com.caverock:androidsvg:1.4'

    // Чистые JVM-тесты политики 24/7 (без Android-рантайма)
    testImplementation 'junit:junit:4.13.2'
}

